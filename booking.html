
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>বুকিং স্ট্যাটাস | আকাশ স্যানিটারি</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#eef3f8;color:#172033}
header{background:#073b68;color:white;text-align:center;padding:25px 12px}
main{max-width:600px;margin:25px auto;padding:12px}
.card{background:white;padding:22px;border-radius:13px;box-shadow:0 3px 12px #0001}
input,button{width:100%;padding:14px;margin:10px 0;border-radius:8px;font-size:16px}
input{border:1px solid #ccc}
button{background:#087b51;color:white;border:0;font-weight:bold}
#result{display:none;margin-top:20px;background:#f2f7fa;padding:18px;border-radius:10px}
.status{font-size:21px;font-weight:bold;color:#087b51}
.row{padding:12px 0;border-bottom:1px solid #ddd}
footer{text-align:center;padding:20px}
</style>
</head>
<body>

<header>
<h2>আকাশ স্যানিটারি ও টাইলস মিস্ত্রি</h2>
<p>বুকিংয়ের আপডেট দেখুন</p>
</header>

<main>
<div class="card">
<h3>আপনার বুকিং খুঁজুন</h3>
<p>বুকিংয়ের সময় পাওয়া Booking ID লিখুন।</p>

<input id="bookingId" placeholder="Booking ID লিখুন">
<button id="checkBtn">স্ট্যাটাস দেখুন</button>

<p id="message"></p>

<div id="result">
<h3>আপনার বুকিং আপডেট</h3>
<div class="row">Booking ID: <b id="id"></b></div>
<div class="row">কাজের অবস্থা:
<div class="status" id="status"></div></div>
<div class="row">মিস্ত্রি যাওয়ার তারিখ:
<b id="workDate"></b></div>
</div>
</div>
</main>

<footer>© আকাশ স্যানিটারি ও টাইলস মিস্ত্রি</footer>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {getFirestore,doc,getDoc}
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBvDv-zJbn5tgFrTt0Y2XHhagRqpL1YPOo",
authDomain: "akash-sanitary-18f8e.firebaseapp.com",
projectId: "akash-sanitary-18f8e",
storageBucket: "akash-sanitary-18f8e.firebasestorage.app",
messagingSenderId: "356604373846",
appId: "1:356604373846:web:d12ac29c648258668b44f7"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const btn=document.getElementById("checkBtn");
const message=document.getElementById("message");
const result=document.getElementById("result");

btn.addEventListener("click",async()=>{
const id=document.getElementById("bookingId").value.trim();

result.style.display="none";
message.textContent="";

if(!id){
message.textContent="Booking ID লিখুন।";
return;
}

btn.disabled=true;
btn.textContent="খোঁজা হচ্ছে...";

try{
const snap=await getDoc(doc(db,"publicBookings",id));

if(!snap.exists()){
message.textContent="বুকিং পাওয়া যায়নি অথবা এখনো আপডেট প্রকাশ করা হয়নি।";
}else{
const data=snap.data();

document.getElementById("id").textContent=id;
document.getElementById("status").textContent=data.status || "নতুন বুকিং";
document.getElementById("workDate").textContent=data.workDate || "এখনো নির্ধারিত হয়নি";

result.style.display="block";
}
}catch(error){
console.error(error);
message.textContent="তথ্য পাওয়া যায়নি। Firebase Rules পরীক্ষা করুন।";
}

btn.disabled=false;
btn.textContent="স্ট্যাটাস দেখুন";
});
</script>

</body>
</html>
