
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>আকাশ স্যানিটারি | Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#eef3f8;color:#172033}
header{background:#073b68;color:white;padding:20px;text-align:center}
.container{max-width:950px;margin:20px auto;padding:12px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:18px;box-shadow:0 3px 12px #0001}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:7px}
button{padding:12px;border:0;border-radius:7px;background:#07558d;color:white;font-weight:bold;margin:4px;cursor:pointer}
.logout,.delete{background:#bd3030}
.booking{border:1px solid #ddd;padding:15px;border-radius:10px;margin:12px 0;background:#fff}
.hidden{display:none}
</style>
</head>
<body>

<header>
<h2>আকাশ স্যানিটারি ও টাইলস মিস্ত্রি</h2>
<p>ADMIN DASHBOARD</p>
</header>

<div class="container">

<div class="card" id="loginBox">
<h3>অ্যাডমিন লগইন</h3>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">লগইন</button>
<p id="loginMsg"></p>
</div>

<div id="dashboard" class="hidden">
<div class="card">
<h3>অ্যাডমিন প্যানেল</h3>
<button class="logout" id="logoutBtn">লগআউট</button>
<h3>মোট বুকিং: <span id="total">0</span></h3>
</div>

<div class="card">
<h3>সকল বুকিং</h3>
<div id="bookings">লোড হচ্ছে...</div>
</div>
</div>

</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
getAuth,onAuthStateChanged,
signInWithEmailAndPassword,signOut
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
getFirestore,collection,onSnapshot,
doc,writeBatch
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyBvDv-zJbn5tgFrTt0Y2XHhagRqpL1YPOo",
authDomain:"akash-sanitary-18f8e.firebaseapp.com",
projectId:"akash-sanitary-18f8e",
storageBucket:"akash-sanitary-18f8e.firebasestorage.app",
messagingSenderId:"356604373846",
appId:"1:356604373846:web:d12ac29c648258668b44f7"
};

const ADMIN_UID="iMdwmEL9JMaZhdhfjpIQoMipO4j2";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const loginBox=document.getElementById("loginBox");
const dashboard=document.getElementById("dashboard");
const msg=document.getElementById("loginMsg");
const area=document.getElementById("bookings");

let unsubscribe=null;

document.getElementById("loginBtn").onclick=async()=>{
try{
msg.textContent="লগইন হচ্ছে...";
await signInWithEmailAndPassword(
auth,
document.getElementById("email").value.trim(),
document.getElementById("password").value
);
}catch(e){
msg.textContent="লগইন হয়নি: "+e.message;
}
};

document.getElementById("logoutBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
if(user && user.uid===ADMIN_UID){
loginBox.classList.add("hidden");
dashboard.classList.remove("hidden");
if(!unsubscribe) loadBookings();
}else{
loginBox.classList.remove("hidden");
dashboard.classList.add("hidden");
if(unsubscribe){
unsubscribe();
unsubscribe=null;
}
if(user) signOut(auth);
}
});

function addLine(parent,label,value){
const p=document.createElement("p");
const b=document.createElement("b");
b.textContent=label+": ";
p.append(b,document.createTextNode(value || "-"));
parent.appendChild(p);
}

function loadBookings(){
unsubscribe=onSnapshot(collection(db,"bookings"),snapshot=>{
document.getElementById("total").textContent=snapshot.size;
area.innerHTML="";

if(snapshot.empty){
area.textContent="এখনো কোনো বুকিং নেই।";
return;
}

snapshot.forEach(item=>{
const b=item.data();
const id=item.id;

const div=document.createElement("div");
div.className="booking";

addLine(div,"বুকিং আইডি",id);
addLine(div,"নাম",b.name);
addLine(div,"ফোন",b.phone);
addLine(div,"ঠিকানা",b.address);
addLine(div,"কাজ",b.service);
addLine(div,"কাস্টমারের তারিখ",b.date);
addLine(div,"বিস্তারিত",b.details);
addLine(div,"বর্তমান স্ট্যাটাস",b.status);

const dateTitle=document.createElement("p");
dateTitle.textContent="কাজ করার তারিখ:";
div.appendChild(dateTitle);

const date=document.createElement("input");
date.type="date";
date.value=b.workDate || "";
div.appendChild(date);

const statusTitle=document.createElement("p");
statusTitle.textContent="স্ট্যাটাস নির্বাচন:";
div.appendChild(statusTitle);

const status=document.createElement("select");

[
"নতুন বুকিং",
"তারিখ নির্ধারিত",
"মিস্ত্রি যাবে",
"কাজ চলছে",
"কাজ সম্পন্ন",
"বাতিল"
].forEach(s=>{
const option=document.createElement("option");
option.value=s;
option.textContent=s;
if((b.status || "নতুন বুকিং")===s) option.selected=true;
status.appendChild(option);
});

div.appendChild(status);

const save=document.createElement("button");
save.textContent="আপডেট করুন";

save.onclick=async()=>{
try{
const batch=writeBatch(db);

batch.update(doc(db,"bookings",id),{
status:status.value,
workDate:date.value
});

batch.set(doc(db,"publicBookings",id),{
status:status.value,
workDate:date.value
},{merge:true});

await batch.commit();
alert("বুকিং আপডেট হয়েছে!");
}catch(e){
alert("আপডেট হয়নি: "+e.message);
}
};

div.appendChild(save);

const del=document.createElement("button");
del.className="delete";
del.textContent="বুকিং মুছুন";

del.onclick=async()=>{
if(!confirm("এই বুকিং মুছে ফেলবেন?")) return;
try{
const batch=writeBatch(db);
batch.delete(doc(db,"bookings",id));
batch.delete(doc(db,"publicBookings",id));
await batch.commit();
alert("বুকিং মুছে ফেলা হয়েছে।");
}catch(e){
alert("মুছতে সমস্যা: "+e.message);
}
};

div.appendChild(del);
area.appendChild(div);
});

},error=>{
area.textContent="বুকিং লোড হয়নি: "+error.message;
});
}
</script>
</body>
</html>
